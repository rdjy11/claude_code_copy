<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汽车软件版本管理系统 - VSMS (AI Native)</title>
<style>
/* ========== Reset ========== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;display:flex;min-height:100vh}
a{text-decoration:none;color:inherit}

/* ========== Sidebar ========== */
.sidebar{width:240px;background:#1a1d28;color:#ccc;flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar-logo{padding:20px;border-bottom:1px solid #2a2d3a;font-size:17px;font-weight:700;color:#fff;display:flex;align-items:center;gap:10px}
.sidebar-logo .icon{width:32px;height:32px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 0}
.nav-group-title{padding:12px 20px 6px;font-size:11px;text-transform:uppercase;color:#666;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:14px;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{background:#22253a;color:#e0e0e0}
.nav-item.active{background:#22253a;color:#fff;border-left-color:#3b82f6;font-weight:600}
.nav-item .badge{font-size:11px;background:#ef4444;color:#fff;padding:1px 7px;border-radius:10px;margin-left:auto}
.nav-item .badge.ok{background:#10b981}

/* ========== Main ========== */
.main{margin-left:240px;flex:1;min-width:0}
.header{background:#fff;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:50}
.header h1{font-size:20px;font-weight:700}
.header-right{display:flex;align-items:center;gap:16px;font-size:13px;color:#888}
.header-right .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.content{padding:24px 28px}
.page{display:none}
.page.active{display:block}

/* ========== Cards ========== */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;transition:all .2s}
.stat-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1);transform:translateY(-1px)}
.stat-card .label{font-size:13px;color:#888;margin-bottom:6px}
.stat-card .value{font-size:28px;font-weight:700}
.stat-card .sub{font-size:12px;color:#888;margin-top:4px}
.stat-card.blue{border-left:4px solid #3b82f6}
.stat-card.orange{border-left:4px solid #f59e0b}
.stat-card.green{border-left:4px solid #10b981}
.stat-card.red{border-left:4px solid #ef4444}

.panel{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:20px}
.panel-header{padding:16px 20px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.panel-header h2{font-size:15px;font-weight:700}
.panel-body{padding:20px}

/* ========== Tables ========== */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:#f8f9fb;color:#666;font-weight:600;font-size:12px;border-bottom:2px solid #e5e7eb;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
tr:hover td{background:#fafbfc}
tr.row-clickable{cursor:pointer}
tr.row-clickable.selected td{background:#eff6ff}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.tag-blue{background:#eff6ff;color:#2563eb}
.tag-green{background:#ecfdf5;color:#059669}
.tag-yellow{background:#fffbeb;color:#d97706}
.tag-red{background:#fef2f2;color:#dc2626}
.tag-gray{background:#f3f4f6;color:#6b7280}
.tag-purple{background:#f5f3ff;color:#7c3aed}

/* ========== Buttons ========== */
.btn{padding:8px 18px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-outline{background:#fff;color:#555;border:1px solid #ddd}
.btn-outline:hover{background:#f5f5f5}
.btn-danger{background:#ef4444;color:#fff;cursor:pointer}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-xs{padding:2px 8px;font-size:10px}
.btn-ai{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff}
.btn-ai:hover{opacity:.9}

/* ========== Grid ========== */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

/* ========== Timeline ========== */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:#e5e7eb}
.timeline-item{position:relative;padding-bottom:20px}
.timeline-item::before{content:'';position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:#3b82f6;border:2px solid #fff;box-shadow:0 0 0 2px #3b82f6}
.timeline-item.done::before{background:#10b981;box-shadow:0 0 0 2px #10b981}

/* ========== Kanban ========== */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kanban-col{background:#f8f9fb;border-radius:8px;padding:12px;min-height:120px}
.kanban-col h3{font-size:13px;font-weight:700;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid #e5e7eb}
.kanban-card{background:#fff;border-radius:6px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer;transition:all .15s}

/* ========== Detail panel ========== */
.detail-panel{display:none;background:#f8f9fb;border-radius:0 0 8px 8px;padding:20px;border-top:2px solid #3b82f6}
.detail-panel.show{display:block}
.detail-section{margin-bottom:16px}
.detail-section h4{font-size:13px;font-weight:700;color:#555;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #e5e7eb}

/* ========== File Upload ========== */
.drop-zone{border:2px dashed #d1d5db;border-radius:8px;padding:28px;text-align:center;cursor:pointer;transition:all .2s;color:#999;font-size:13px}
.drop-zone:hover,.drop-zone.drag-over{border-color:#3b82f6;color:#3b82f6;background:#f8faff}
.drop-zone input[type=file]{display:none}
.file-list{display:grid;gap:8px;margin-top:12px}
.file-item{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#f8f9fb;border-radius:6px;font-size:13px}
.file-item .name{flex:1;font-weight:600}
.file-item .size{color:#999;font-size:11px}
.file-item .meta{font-size:11px;color:#999}

/* ========== Toolbar ========== */
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search-input{padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;width:260px}
.filter-select{padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;background:#fff}

/* ========== Modal ========== */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:28px;width:600px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h2{font-size:18px;margin-bottom:20px}
.modal label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:#555;margin-top:12px}
.modal input,.modal select,.modal textarea{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-bottom:8px;font-family:inherit}
.modal textarea{resize:vertical;min-height:80px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}

/* ========== AI Panel ========== */
.ai-toggle{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-size:22px;border:none;cursor:pointer;z-index:150;box-shadow:0 4px 16px rgba(99,102,241,.4);transition:all .2s;display:flex;align-items:center;justify-content:center}
.ai-toggle:hover{transform:scale(1.08);box-shadow:0 6px 24px rgba(99,102,241,.5)}
.ai-toggle.has-msg::after{content:'';position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:#10b981}
.ai-panel{position:fixed;bottom:88px;right:24px;width:420px;height:560px;background:#fff;border-radius:14px;box-shadow:0 12px 48px rgba(0,0,0,.15);z-index:149;display:none;flex-direction:column;overflow:hidden}
.ai-panel.show{display:flex}
.ai-panel-header{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.ai-panel-header h3{font-size:15px;display:flex;align-items:center;gap:8px}
.ai-panel-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.ai-msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;animation:fadeIn .3s}
.ai-msg.user{align-self:flex-end;background:#3b82f6;color:#fff;border-bottom-right-radius:4px}
.ai-msg.bot{align-self:flex-start;background:#f3f4f6;color:#333;border-bottom-left-radius:4px}
.ai-msg.bot pre{background:#1a1d28;color:#10b981;padding:8px 12px;border-radius:6px;font-size:11px;margin:6px 0;overflow-x:auto}
.ai-panel-input{border-top:1px solid #eee;padding:12px 16px;display:flex;gap:8px}
.ai-panel-input input{flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:20px;font-size:13px;outline:none;font-family:inherit}
.ai-panel-input input:focus{border-color:#8b5cf6}
.ai-quick-actions{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 0}
.ai-quick{font-size:11px;padding:4px 10px;border-radius:12px;background:#f3f4f6;border:1px solid #eee;cursor:pointer;white-space:nowrap;transition:all .15s}
.ai-quick:hover{background:#e5e7ff;border-color:#c4b5fd}

/* ========== File Upload Form ========== */
.upload-form{background:#f8f9fb;border-radius:8px;padding:20px}
.upload-form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.form-field{display:flex;flex-direction:column}
.form-label{font-size:13px;font-weight:600;color:#555;margin-bottom:6px}
.form-select{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;background:#fff;color:#333;font-family:inherit;transition:border-color .15s}
.form-select:focus{border-color:#3b82f6;outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.1)}

/* ========== Config Baseline Tabs ========== */
.config-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.config-tabs .config-tab{padding:7px 16px;border-radius:6px;font-size:13px;cursor:pointer;border:none;background:#e8e9ee;color:#888;font-weight:400;transition:all .15s;font-family:inherit;white-space:nowrap}
.config-tabs .config-tab:hover{background:#ddd;color:#555}
.config-tabs .config-tab.active{background:#3b82f6;color:#fff;font-weight:600}
.config-tabs .config-tab .count{font-size:11px;opacity:.7;margin-left:4px}

/* ========== Toast ========== */
.toast{position:fixed;top:24px;right:24px;background:#10b981;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:300;animation:slideIn .3s;box-shadow:0 4px 12px rgba(16,185,129,.3)}
.toast.error{background:#ef4444;box-shadow:0 4px 12px rgba(239,68,68,.3)}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ========== Responsive ========== */
@media(max-width:1200px){.stats-grid{grid-template-columns:repeat(2,1fr)}.kanban{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
@media(max-width:768px){.sidebar{width:60px}.sidebar-logo span,.nav-item span,.nav-group-title{display:none}.main{margin-left:60px}.ai-panel{width:calc(100vw - 48px);right:24px}}
</style>
</head>
<body>

<!-- ===== Sidebar ===== -->
<aside class="sidebar">

<script>
// ============================
//  API LAYER
// ============================
const API_BASE = '/api';

async function apiGet(path) {
  const resp = await fetch(API_BASE + path);
  if (!resp.ok) throw new Error(resp.status + ' ' + resp.statusText);
  return resp.json();
}

async function apiPost(path, data) {
  const resp = await fetch(API_BASE + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  if (!resp.ok) throw new Error(resp.status + ' ' + resp.statusText);
  return resp.json();
}

async function apiPut(path, data) {
  const resp = await fetch(API_BASE + path, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  if (!resp.ok) throw new Error(resp.status + ' ' + resp.statusText);
  return resp.json();
}

async function apiDelete(path) {
  const resp = await fetch(API_BASE + path, { method: 'DELETE' });
  if (!resp.ok) throw new Error(resp.status + ' ' + resp.statusText);
  return resp.json();
}

// ============================
//  DATA STORE (loaded from API)
// ============================
const today = new Date().toISOString().split('T')[0];

let _idCounter = 100;
function genId(prefix) { return prefix + '-' + today.replace(/-/g,'') + '-' + (++_idCounter); }

// Field mapping: API snake_case → frontend camelCase
function mapBaseline(b) {
  return { id:b.id, name:b.name, domain:b.domain, phase:b.phase, ecuCount:b.ecu_count, creator:b.creator, created:b.created_date, frozen:b.frozen_date||'', status:b.status, desc:b.description||'' };
}
function mapVersion(v) {
  return { id:v.id, name:v.name, project:v.project, domain:v.domain, ecu:v.ecu, major:v.major, minor:v.minor, patch:v.patch, phase:v.phase, rxswin:v.rxswin, status:v.status, baselineId:v.baseline_id||'', created:v.created_date };
}
function mapCI(c) {
  return { id:c.id, type:c.type, name:c.name, version:c.version, location:c.location, baselineId:c.baseline_id };
}
function mapChange(c) {
  return { id:c.id, title:c.title, type:c.type, urgency:c.urgency, status:c.status, applicant:c.applicant, baselineId:c.baseline_id||'', created:c.created_date };
}
function mapRelease(r) {
  return { id:r.id, name:r.name, type:r.type, ecuCount:r.ecu_count, version:r.version, created:r.created_date, status:r.status, baselineIds:r.baseline_ids||[] };
}
function mapFile(f) {
  return { id:f.id, name:f.name, size:f.size, type:f.type, baselineId:f.baseline_id, uploaded:f.uploaded_date };
}

const store = {
  baselines: [],
  versions: [],
  configItems: [],
  changes: [],
  releases: [],
  files: [],
  auditLogs: [
    { date:'2026-04-30', type:'物理审计', scope:'全量CI', result:'通过' },
    { date:'2026-04-15', type:'功能审计', scope:'智驾域', result:'通过' },
    { date:'2026-04-01', type:'物理审计', scope:'全量CI', result:'1项缺失(已修复)' },
    { date:'2026-03-15', type:'功能审计', scope:'全量CI', result:'通过' }
  ]
};

let _storeLoaded = false;

async function loadStore() {
  if (_storeLoaded) return;
  try {
    const [baselines, versions, configItems, changes, releases, files] = await Promise.all([
      apiGet('/baselines'), apiGet('/versions'), apiGet('/config-items'),
      apiGet('/changes'), apiGet('/releases'), apiGet('/files')
    ]);
    store.baselines = baselines.map(mapBaseline);
    store.versions = versions.map(mapVersion);
    store.configItems = configItems.map(mapCI);
    store.changes = changes.map(mapChange);
    store.releases = releases.map(mapRelease);
    store.files = files.map(mapFile);
    _storeLoaded = true;
    console.log('Data loaded from API:', store.baselines.length, 'baselines,', store.versions.length, 'versions,', store.configItems.length, 'CIs,', store.changes.length, 'changes,', store.releases.length, 'releases,', store.files.length, 'files');
  } catch(e) {
    console.warn('API connection failed, using seed data from API fallback:', e.message);
  }
}

// ============================
//  HELPERS
// ============================
function toast(msg, isErr) {
  var t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' error' : '');
  t.textContent = msg; document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2500);
}

function getBaselineName(id) {
  var bl = store.baselines.find(function(b){ return b.id === id; });
  return bl ? bl.name : '未关联';
}

function getBaselineOptions(selectedId) {
  return store.baselines.map(function(b){
    return '<option value="'+b.id+'"'+(b.id===selectedId?' selected':'')+'>'+b.name+' ('+b.status+')</option>';
  }).join('');
}

function getStatusTag(status) {
  var map = {'已冻结':'tag-green','评审中':'tag-yellow','开发中':'tag-blue','测试中':'tag-yellow','准出通过':'tag-green','待评审':'tag-yellow','实施中':'tag-blue','已关闭':'tag-gray','通过':'tag-green'};
  return '<span class="tag '+ (map[status]||'tag-gray') +'">'+status+'</span>';
}

function getTypeTag(type) {
  var map = {'源码':'tag-blue','二进制':'tag-yellow','标定':'tag-green','文档':'tag-gray','OTA':'tag-blue','基线':'tag-gray','Hotfix':'tag-red'};
  return '<span class="tag '+(map[type]||'tag-gray')+'">'+type+'</span>';
}

// ============================
//  CONTENT RENDERER
// ============================
function openModal(html) {
  var container = document.getElementById('modalsContainer');
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay show';
  overlay.innerHTML = '<div class="modal">'+html+'</div>';
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
  container.appendChild(overlay);
  return overlay;
}

// ============================
//  AI PANEL
// ============================
function toggleAI() {

function sendAIMessage() {
  var input = document.getElementById('aiInput');
  var text = input.value.trim();
  if (!text) return;
  addAIMessage('user', text);
  input.value = '';

  // Simple keyword matching
  var reply = '';
  var lc = text.toLowerCase();
  if (lc.includes('影响')||lc.includes('impact')) reply = aiResponses.analyzeImpact;
  else if (lc.includes('release')||lc.includes('发布说明')) reply = aiResponses.generateReleaseNote;
  else if (lc.includes('合规')||lc.includes('compliance')) reply = aiResponses.checkCompliance;
  else if (lc.includes('版本号')||lc.includes('version')) reply = aiResponses.suggestVersion;
  else if (lc.includes('追溯')||lc.includes('trace')) reply = aiResponses.traceCheck;
  else reply = '收到你的问题：「'+text+'」。目前我可以帮助你进行：\n\n1. **影响分析** — 评估变更对上下游ECU的影响\n2. **生成Release Note** — 自动生成发布说明\n3. **合规检查** — 检查ASPICE/UNECE R156合规状态\n4. **版本号建议** — 根据变更类型推荐版本号\n5. **追溯完整性** — 检查需求到发布的全链路\n\n请点击快捷按钮或直接描述你的需求。';

  setTimeout(function(){ addAIMessage('bot', reply); }, 600);
}

function addAIMessage(role, text) {
  var msgs = document.getElementById('aiMessages');
  var div = document.createElement('div');
  div.className = 'ai-msg ' + role;
  div.innerHTML = text.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/```([^`]*)```/g,'<pre>$1</pre>');
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

async function createVersion() {
  var proj = document.getElementById('vProj').value.trim();
  var domain = document.getElementById('vDomain').value;
  var ecu = document.getElementById('vEcu').value.trim();
  var major = parseInt(document.getElementById('vMajor').value)||1;
  var minor = parseInt(document.getElementById('vMinor').value)||0;
  var patch = parseInt(document.getElementById('vPatch').value)||0;
  var phase = document.getElementById('vPhase').value;
  var rxswin = document.getElementById('vRxswin').value.trim();
  var baselineId = document.getElementById('vBaseline').value;
  if (!ecu) { toast('请输入ECU名称', true); return; }
  var name = proj+'_'+domain+'_'+ecu+'_'+major+'.'+minor+'.'+patch+'_'+phase;
  var v = { id:genId('V'), name:name, project:proj, domain:domain, ecu:ecu, major:major, minor:minor, patch:patch, phase:phase, rxswin:rxswin||'RXS-'+proj+'-'+ecu.substring(0,3)+'-001', status:'开发中', baselineId:baselineId, created:today };
  try {
    var created = await apiPost('/versions', { id:v.id, name:v.name, project:v.project, domain:v.domain, ecu:v.ecu, major:v.major, minor:v.minor, patch:v.patch, phase:v.phase, rxswin:v.rxswin, status:v.status, baselineId:v.baselineId||null, createdDate:v.created });
    store.versions.push(mapVersion(created));
  } catch(e) {
    console.warn('API save failed, using local store:', e.message);
    store.versions.push(v);
  }
  document.querySelectorAll('#modalsContainer .modal-overlay').forEach(function(o){ o.remove(); });
  renderPage('versions');
  toast('版本 '+name+' 已创建');
}

function switchConfigTab(baselineId, btn) {

function renderConfigTable(baselineId) {
  var tbody = document.getElementById('configTableBody');
  if (!tbody) return;
  var items = [];
  if (baselineId === 'all') {
    store.configItems.forEach(function(c){ items.push({type:'ci',data:c}); });
    store.files.forEach(function(f){ items.push({type:'file',data:f}); });
  } else {
    store.configItems.filter(function(c){return c.baselineId===baselineId;}).forEach(function(c){ items.push({type:'ci',data:c}); });
    store.files.filter(function(f){return f.baselineId===baselineId;}).forEach(function(f){ items.push({type:'file',data:f}); });
  }
  if (items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;padding:24px">该基线下暂无配置项或文件</td></tr>';
    return;
  }
  tbody.innerHTML = items.map(function(item){
    if (item.type === 'ci') {
      var c = item.data;
      return '<tr><td>'+getTypeTag(c.type)+' <span class="tag tag-purple" style="margin-left:4px">配置项</span></td><td><strong>'+c.name+'</strong></td><td>'+c.version+'</td><td>'+c.location+'</td><td><span class="tag tag-blue">'+getBaselineName(c.baselineId)+'</span></td><td>—</td><td>—</td></tr>';
    } else {
      var f = item.data;
      return '<tr><td>'+getTypeTag(f.type)+' <span class="tag tag-gray" style="margin-left:4px">文件</span></td><td><strong>'+f.name+'</strong></td><td>'+f.size+'</td><td>本地上传</td><td><span class="tag tag-blue">'+getBaselineName(f.baselineId)+'</span></td><td>'+f.uploaded+'</td><td><button class="btn btn-xs btn-outline" onclick="downloadFile(\''+f.name+'\')">下载</button></td></tr>';
    }
  }).join('');
}

function handleConfigDrop(e) {
  e.preventDefault();
  e.target.classList.remove('drag-over');
  handleConfigFiles(e.dataTransfer.files);
}

async function handleConfigFiles(fileList) {
  var baselineId = document.getElementById('uploadBaselineSelect').value;
  if (!baselineId) { toast('请先选择关联基线', true); return; }
  var fileTypeSelect = document.getElementById('uploadFileType').value;
  var count = 0;
  for (var i=0; i<fileList.length; i++) {
    var f = fileList[i];
    try {
      var formData = new FormData();
      formData.append('file', f);
      formData.append('baseline_id', baselineId);
      if (fileTypeSelect !== '自动识别') formData.append('type', fileTypeSelect);
      var resp = await fetch(API_BASE + '/files/upload', { method: 'POST', body: formData });
      if (resp.ok) {
        var created = await resp.json();
        store.files.push(mapFile(created));
        count++;
      }
    } catch(e) {
      console.warn('File upload failed:', f.name, e.message);
    }
  }
  renderConfigTable(window._configTab || 'all');
  var recentFiles = store.files.slice().reverse().slice(0, 10);
  var listEl = document.getElementById('recentFileList');
  if (listEl) {
    listEl.innerHTML = recentFiles.map(function(f){ return '<div class="file-item"><span class="name">'+f.name+'</span><span class="size">'+f.size+'</span><span class="meta">'+getBaselineName(f.baselineId)+' · '+f.uploaded+'</span></div>'; }).join('');
  }
  if (count > 0) toast(count+' 个文件已上传到 '+getBaselineName(baselineId));
  var zone = document.getElementById('configDropZone');
  if (zone) { var inp = zone.querySelector('input'); if (inp) inp.value = ''; }
}

async function createRelease() {
  var name = document.getElementById('relName').value.trim();
  if (!name) { toast('请输入发布包名称', true); return; }
  var sel = document.getElementById('relBaselines');
  var selectedIds = [];
  for (var i=0; i<sel.options.length; i++) { if (sel.options[i].selected) selectedIds.push(sel.options[i].value); }
  var r = { id:genId('REL'), name:name, type:document.getElementById('relType').value, ecuCount:parseInt(document.getElementById('relEcuCount').value)||1, version:'1.0.0', created:today, status:'准出通过', baselineIds:selectedIds };
  try {
    var created = await apiPost('/releases', { id:r.id, name:r.name, type:r.type, ecuCount:r.ecuCount, version:r.version, status:r.status, baselineIds:r.baselineIds, createdDate:r.created });
    store.releases.push(mapRelease(created));
  } catch(e) {
    console.warn('API save failed, using local store:', e.message);
    store.releases.push(r);
  }
  document.querySelectorAll('#modalsContainer .modal-overlay').forEach(function(o){ o.remove(); });
  renderPage('release');
  toast('发布包 '+name+' 已创建（关联 '+selectedIds.length+' 个基线）');
}

// ============================
//  FILE UPLOAD
// ============================
function handleFiles(fileList, baselineId) {
  for (var i=0; i<fileList.length; i++) {
    var f = fileList[i];
    var sizeStr = f.size < 1024*1024 ? (f.size/1024).toFixed(1)+' KB' : (f.size/(1024*1024)).toFixed(1)+' MB';
    var typeCat = f.name.match(/\.(bin|hex|s19)$/i) ? '标定' : f.name.match(/\.(pdf|doc|docx|xlsx|md|txt)$/i) ? '文档' : f.name.match(/\.(c|cpp|h|py|java)$/i) ? '源码' : '二进制';
    store.files.push({ name:f.name, size:sizeStr, type:typeCat, baselineId:baselineId, uploaded:today });
    refreshFileList(baselineId);
  }
  toast(fileList.length+' 个文件已上传到基线 '+getBaselineName(baselineId));
}

function handleDrop(e, baselineId) {
  e.preventDefault();
  e.target.classList.remove('drag-over');
  handleFiles(e.dataTransfer.files, baselineId);
}

function refreshFileList(baselineId) {
  var listEl = document.getElementById('fileList-'+baselineId);
  if (!listEl) return;
  var files = store.files.filter(function(f){ return f.baselineId===baselineId; });
  listEl.innerHTML = files.map(function(f){ return '<div class="file-item"><span class="name">'+f.name+'</span><span class="size">'+f.size+'</span><span class="meta">'+f.uploaded+'</span></div>'; }).join('');
}

function filterTableLive(el, tableId) {
  var filter = el.value.toLowerCase();
  var rows = document.querySelectorAll('#'+tableId+' tbody tr:not(.detail-row)');
  rows.forEach(function(row) {
    row.style.display = row.textContent.toLowerCase().includes(filter) ? '' : 'none';
  });
}

(async function init() {
  await loadStore();
  renderPage('dashboard');
  updateBadges();
  console.log('VSMS initialized — Versions:', store.versions.length, '| Baselines:', store.baselines.length, '| CIs:', store.configItems.length, '| Changes:', store.changes.length, '| Releases:', store.releases.length, '| Files:', store.files.length);
})();

function updateBadges() {
  var pendingReview = store.baselines.filter(function(b){ return b.status==='评审中'; }).length;
  var pendingCR = store.changes.filter(function(c){ return c.status!=='已关闭'; }).length;
  var blBadge = document.getElementById('badgeBaseline');
  var chBadge = document.getElementById('badgeChange');
  if (blBadge) { blBadge.textContent = pendingReview || '0'; blBadge.style.display = pendingReview ? '' : 'none'; }
  if (chBadge) { chBadge.textContent = pendingCR || '0'; chBadge.style.display = pendingCR ? '' : 'none'; }
}
