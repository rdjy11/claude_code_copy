version: "3.9"

services:
  # ── Infrastructure ─────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aivas
      POSTGRES_USER: aivas
      POSTGRES_PASSWORD: aivas_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivas"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/aivas_dev
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aivas_admin
      MINIO_ROOT_PASSWORD: aivas_dev123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # ── Application ────────────────────────────────────────────────

  aivas-core:
    build:
      context: ./aivas-core
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      AIVAS_DATABASE_URL: "postgresql+asyncpg://aivas:aivas_dev@postgres:5432/aivas"
      AIVAS_DATABASE_URL_SYNC: "postgresql+psycopg2://aivas:aivas_dev@postgres:5432/aivas"
      AIVAS_NEO4J_URI: "bolt://neo4j:7687"
      AIVAS_REDIS_URL: "redis://redis:6379/0"
      AIVAS_S3_ENDPOINT: "minio:9000"
      AIVAS_DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./aivas-core:/app
    command: python run.py

  aivas-ui:
    build:
      context: ./aivas-ui
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8000"
    depends_on:
      - aivas-core
    volumes:
      - ./aivas-ui:/app
      - /app/node_modules

volumes:
  pgdata:
  neo4jdata:
  neo4jlogs:
  redisdata:
  miniodata:
